%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters (AirMuseum RobotA - RGB-D, rectified left camera (cam101) + FoundationStereo depth)
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Rectified left-camera intrinsics (from robotA stereo rectification)
Camera1.fx: 310.48215580302417
Camera1.fy: 310.48215580302417
Camera1.cx: 325.33289992201605
Camera1.cy: 254.8405005378657

Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

# Camera resolution
Camera.width: 640
Camera.height: 512

# Camera frames per second (~20Hz)
Camera.fps: 20

# Color order of the images (0: BGR, 1: RGB) - irrelevant for Mono8 images
Camera.RGB: 0

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0
Stereo.b: 0.2621949458115741

# Depth map values factor (1000 = millimeters to meters)
RGBD.DepthMapFactor: 1000.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 3000
ORBextractor.scaleFactor: 1.1
ORBextractor.nLevels: 10
ORBextractor.iniThFAST: 15
ORBextractor.minThFAST: 5

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
